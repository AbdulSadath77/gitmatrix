name: Build tiles

on:
  schedule:
    # Daily at 02:00 UTC. Contribution data changes at most once a day, so
    # there is nothing to gain from running more often.
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No install step: gitmatrix has no runtime dependencies.
      - run: node test.mjs

      # Start from what is already published, so a tile whose data source is
      # unreachable this run keeps serving its last good render instead of
      # being dropped by the force-push below. Empty on the first ever run.
      - name: Seed dist from the published tiles
        run: |
          set -euo pipefail
          mkdir -p dist
          if git fetch -q --depth=1 origin tiles 2>/dev/null; then
            # git archive, not `checkout --work-tree`: extracting a tree must
            # not touch this repo's index.
            git archive origin/tiles | tar -x -C dist
            ls -1 dist | sed 's/^/  carried over: /'
          else
            echo "  no tiles branch yet -- first run"
          fi

      # No token, by design: `calendar` reads the public contributions page and
      # `profile` uses public REST. REST is 60/hr per runner IP and that budget
      # is shared, so a profile tile can miss a run -- it then keeps the render
      # seeded above rather than failing the build.
      - name: Render tiles
        run: node bin/build.mjs

      - name: Publish dist to the tiles branch
        run: |
          set -euo pipefail
          cd dist
          # Force-push a single-commit orphan branch. The rendered SVGs are
          # derived artifacts, so keeping their history would grow the repo
          # every day for no benefit.
          git init -q -b tiles
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "tiles: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            tiles

      # Generated from the tile registry, so this failing means a tile is
      # broken -- the gallery build doubles as a check on every component.
      - name: Build gallery
        run: node bin/gallery.mjs

      - name: Publish gallery to gh-pages
        run: |
          set -euo pipefail
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "gallery: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

      - name: Purge the jsDelivr cache
        # jsDelivr holds branch URLs for 12h; this makes the new render live
        # immediately. Best-effort -- a failure here must not fail the build.
        continue-on-error: true
        run: |
          for f in $(cd dist && ls *.svg); do
            curl -sS -o /dev/null -w "purge %{http_code} $f\n" \
              "https://purge.jsdelivr.net/gh/${{ github.repository }}@tiles/$f" || true
          done
